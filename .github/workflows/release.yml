name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: ht-darwin-arm64
            runner: macos-15
          - target: bun-darwin-x64-baseline
            asset: ht-darwin-x64
            runner: macos-15-intel
          - target: bun-linux-arm64
            asset: ht-linux-arm64
            runner: ubuntu-latest
          - target: bun-linux-x64-baseline
            asset: ht-linux-x64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun build src/entry.ts --compile --target=${{ matrix.target }} --outfile=${{ matrix.asset }}
      - if: ${{ startsWith(matrix.target, 'bun-darwin') }}
        run: ./${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: cd release && sha256sum ht-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') }}
          files: |
            release/ht-*
            release/SHA256SUMS
