name: Provider format change
description: Report a sanitized Codex or Claude Code format incompatibility.
title: "provider: "
labels: [bug]
body:
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Codex
        - Claude Code
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: Provider version
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Observed format change
      description: Describe field shapes using invented values only. Do not paste a real transcript.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: HT impact
      description: Explain what capture, normalization, or display behavior changed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: All examples are synthetic and contain no captured session content.
          required: true
